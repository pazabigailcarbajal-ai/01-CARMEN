<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carmen · Derecho Penal · Cap. 1</title>
<meta name="description" content="Plataforma de estudio guiado de la Primera parte, Capítulo primero (Concepción) de Lecciones de derecho penal, Díaz-Aranda, ajustada a Carmen">
<meta name="theme-color" content="#c2185b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display&display=swap">
<style>
/* Concepto: «Expediente rosa» (mismo estilo que los capítulos 2 a 14); citas del libro como fojas engrapadas, rosa como color de marca. */
:root {
  --bg: #fbf1f5;
  --surface: #ffffff;
  --surface-2: #f8e6ee;
  --ink: #2b1621;
  --muted: #7b5b69;
  --line: #efd3df;
  --accent: #c2185b;
  --accent-2: #e04a86;
  --accent-soft: #fde1ec;
  --on-accent: #ffffff;
  --mark: #ffc4da;
  --mark-ink: #2b1621;
  --ok: #18794e;
  --ok-soft: #ddf3e8;
  --bad: #b3261e;
  --bad-soft: #fde4e1;
  --warn: #8a5300;
  --warn-soft: #fff0d9;
  --paper-rule: #f3c6d7;
  --shadow: 0 1px 2px rgba(120, 20, 60, .06), 0 8px 22px rgba(120, 20, 60, .07);
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --r: 16px;
  --cw: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #170c12; --surface: #241520; --surface-2: #301c29; --ink: #f9e9f0; --muted: #c4a3b2; --line: #44293a;
    --accent: #ff6fa3; --accent-2: #ff9cc0; --accent-soft: #3d1a2c; --on-accent: #2a0716;
    --mark: #6e2547; --mark-ink: #fff0f6; --ok: #62d39c; --ok-soft: #153325; --bad: #ff8b80; --bad-soft: #3e1c1a;
    --warn: #ffc56b; --warn-soft: #3a2a12; --paper-rule: #5c2a42; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #170c12; --surface: #241520; --surface-2: #301c29; --ink: #f9e9f0; --muted: #c4a3b2; --line: #44293a;
  --accent: #ff6fa3; --accent-2: #ff9cc0; --accent-soft: #3d1a2c; --on-accent: #2a0716;
  --mark: #6e2547; --mark-ink: #fff0f6; --ok: #62d39c; --ok-soft: #153325; --bad: #ff8b80; --bad-soft: #3e1c1a;
  --warn: #ffc56b; --warn-soft: #3a2a12; --paper-rule: #5c2a42; --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
mark { background: linear-gradient(transparent 40%, var(--mark) 40%, var(--mark) 92%, transparent 92%); color: var(--mark-ink); padding: 0 2px; }
a { color: var(--accent); }
.app { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.app > * { min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; font-family: var(--font-body); font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.eyebrow { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.stack { display: grid; gap: 12px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.stack.tight { gap: 3px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; display: grid; gap: 10px; }
.card.quiet { box-shadow: none; background: transparent; border: 1.5px dashed var(--paper-rule); }
.tnum { font-variant-numeric: tabular-nums; }
.tight-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.btn { border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; text-decoration: none; max-width: 100%; text-align: center; line-height: 1.25; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.line { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { padding: 8px 14px; min-height: 40px; font-size: .9rem; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 700; min-height: 38px; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); text-align: left; }
.icon-btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip { display: inline-flex; align-items: center; font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.bar.ok > i { background: var(--ok); }

/* Inicio */
.hero { background: var(--accent); color: var(--on-accent); border-radius: 22px; padding: 22px 20px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.hero::after { content: "§"; position: absolute; right: -8px; top: -38px; font-family: var(--font-display); font-size: 11rem; line-height: 1; opacity: .13; pointer-events: none; }
.hero h1 { font-size: 2.3rem; color: var(--on-accent); }
.hero .sub { opacity: .92; max-width: 46ch; }
.eyebrow.on-acc { color: var(--on-accent); opacity: .8; }
.hero-meter { display: grid; gap: 6px; margin-top: 4px; font-weight: 700; font-size: .92rem; }
.hero .bar { background: rgba(255,255,255,.28); }
.hero .bar > i { background: var(--on-accent); }
.next-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; }
.big-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.6rem; }
.due { border: 2px solid var(--accent); }
.mission-l { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.mission-l .t { flex: 1; min-width: 0; font-weight: 700; }
.method-l { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.method-l li::marker { color: var(--accent); font-weight: 800; }
.motiv { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.3; color: var(--accent); }

/* Aprender */
.route { display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.lrow .n { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--paper-rule); display: grid; place-items: center; font-weight: 800; color: var(--accent); font-family: var(--font-display); font-size: 1.05rem; }
.lrow.done .n { background: var(--ok); border-color: var(--ok); color: var(--on-accent); font-family: var(--font-body); }
.lrow .tt { font-weight: 700; line-height: 1.3; }
.lrow .meta { font-size: .8rem; color: var(--muted); line-height: 1.35; }
.lrow .ic { font-size: 1.3rem; }
.back { border: 0; background: none; color: var(--accent); font-weight: 800; padding: 6px 0; justify-self: start; }
.lesson-top { display: grid; gap: 8px; }
.goal { font-size: .95rem; color: var(--muted); }
.steps-dots { display: flex; gap: 4px; }
.steps-dots i { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); }
.steps-dots i.on { background: var(--accent); }
.steps-dots i.cur { background: var(--accent-2); }
.sheet { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 18px 20px 30px; position: relative; display: grid; gap: 12px; min-width: 0; }
.sheet::before { content: ""; position: absolute; left: 14px; top: 16px; bottom: 16px; width: 2px; background: var(--paper-rule); border-radius: 2px; }
.sheet h2 { color: var(--accent); }
.sheet .body { font-size: 1.07rem; line-height: 1.7; }
.nav-btns { display: flex; gap: 10px; }
.nav-btns .btn { flex: 1; }
.callout { border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.callout.trap { background: var(--bad-soft); }
.callout.trap h3 { color: var(--bad); }
.callout.trick { background: var(--accent-soft); }
.callout.trick h3 { color: var(--accent); }
.callout ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.ta { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); resize: vertical; min-height: 140px; line-height: 1.55; }
.model { background: var(--ok-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin-top: 2px; }

/* Visuales */
.vis { min-width: 0; }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: flex; min-width: max-content; }
.line-item { width: 138px; display: grid; gap: 4px; justify-items: center; align-content: start; text-align: center; position: relative; padding: 0 6px; }
.line-item::before { content: ""; position: absolute; top: calc(2.6em + 9px); left: 0; right: 0; height: 3px; background: var(--paper-rule); }
.line-age { font-size: .78rem; font-weight: 800; color: var(--accent); min-height: 2.6em; display: grid; align-items: end; line-height: 1.2; }
.line-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.line-t { font-weight: 700; font-size: .88rem; line-height: 1.2; }
.line-s { font-size: .76rem; color: var(--muted); line-height: 1.3; }
.flow { display: grid; gap: 4px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.flow-step b { display: block; line-height: 1.25; }
.flow-step small { display: block; line-height: 1.4; margin-top: 2px; color: var(--muted); font-size: .88rem; }
.flow-n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
.flow-arrow { text-align: center; color: var(--muted); line-height: 1; font-size: .9rem; }
.tbl-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); }
.tbl { border-collapse: collapse; width: 100%; font-size: .92rem; min-width: 420px; }
.tbl th { background: var(--accent-soft); color: var(--accent); text-align: left; padding: 8px 10px; font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.tree { display: grid; gap: 10px; justify-items: center; }
.tree-root { background: var(--accent); color: var(--on-accent); padding: 8px 18px; border-radius: 12px; font-family: var(--font-display); font-size: 1.1rem; }
.tree-kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: 100%; }
.tree-kid { border: 2px solid var(--accent); border-radius: 12px; padding: 10px; display: grid; gap: 4px; }
.tree-kid small { color: var(--muted); line-height: 1.35; }
.vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; }
.vs-col { background: var(--surface-2); border-radius: 12px; padding: 12px; min-width: 0; }
.vs-h { font-weight: 800; font-size: .82rem; letter-spacing: .03em; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
.vs-col ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: .93rem; line-height: 1.4; }
.vs-mid { align-self: center; font-family: var(--font-display); color: var(--muted); }
@media (max-width: 480px) { .vs { grid-template-columns: minmax(0,1fr); } .vs-mid { justify-self: center; } }
.pairs { display: grid; gap: 6px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .93rem; line-height: 1.4; }
@media (max-width: 480px) { .pair { grid-template-columns: minmax(0,1fr); gap: 2px; } }
.bookq, .nowbox { border-radius: 4px 14px 14px 4px; border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; display: grid; gap: 6px; }
.nowbox { border-left-color: var(--warn); background: var(--warn-soft); }
.bookq-h { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nowbox .bookq-h { color: var(--warn); }
.bookq-b { font-size: .98rem; line-height: 1.55; }

/* Preguntas */
.q { gap: 12px; }
.q-text { font-size: 1.07rem; font-weight: 700; line-height: 1.5; }
.qn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .8rem; margin-right: 8px; vertical-align: 2px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; min-height: 50px; line-height: 1.4; }
.opt .ov { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--paper-rule); display: grid; place-items: center; font-weight: 800; font-size: .82rem; color: var(--muted); }
.opt:not([disabled]):hover { border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.ok .ov { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.no { border-color: var(--bad); background: var(--bad-soft); }
.opt.no .ov { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }
.fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb b.h { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.fb.ok b.h { color: var(--ok); }
.fb.no b.h { color: var(--bad); }
.fb .pg { font-size: .8rem; font-weight: 700; color: var(--muted); }
.grade { justify-items: center; text-align: center; padding: 22px; }
.grade > b { font-family: var(--font-display); font-weight: 400; font-size: 4rem; line-height: 1; color: var(--accent); }
.review-item { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; font-size: .95rem; overflow-wrap: anywhere; }
.review-item .ok { color: var(--ok); font-weight: 700; }
.search { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; background: var(--surface); min-height: 46px; }

/* Practicar */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.tile { border: 0; text-align: left; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 4px; align-content: start; min-height: 112px; }
.tile .ti { font-size: 1.5rem; }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.tile span:last-child { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.tf-card { text-align: center; font-size: 1.2rem; font-weight: 700; padding: 30px 18px; line-height: 1.45; }
.tf-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.order-list { display: grid; gap: 8px; }
.order-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; line-height: 1.35; }
.order-item .on { font-weight: 800; color: var(--accent); text-align: center; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 800; }
.order-item .mv button[disabled] { opacity: .3; }
.order-item.good { border-color: var(--ok); background: var(--ok-soft); }
.order-item.badp { border-color: var(--bad); background: var(--bad-soft); }
.match-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.match-grid .stack { gap: 8px; }
.match-grid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; min-height: 56px; font-size: .92rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.match-grid button.sel { border-color: var(--accent); background: var(--accent-soft); }
.match-grid button.done { border-color: var(--ok); background: var(--ok-soft); opacity: .7; }
.match-grid button.err { border-color: var(--bad); background: var(--bad-soft); }
.flip { perspective: 1000px; border: 0; background: none; padding: 0; width: 100%; }
.flip-in { position: relative; min-height: 240px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; padding: 24px; display: grid; place-items: center; text-align: center; font-size: 1.25rem; font-weight: 700; line-height: 1.4; box-shadow: var(--shadow); }
.face.front { background: var(--surface); border: 2px solid var(--paper-rule); }
.face.back { background: var(--accent); color: var(--on-accent); transform: rotateY(180deg); font-size: 1.05rem; font-weight: 600; }
.face small { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.face small.hint-s { margin: 12px 0 0; }

/* Crucigrama */
.cw-wrap { overflow-x: auto; padding: 4px 0 8px; }
.cw { display: grid; gap: 2px; width: max-content; margin: 0 auto; }
.cw-x { width: var(--cw); height: var(--cw); }
.cw-c { position: relative; width: var(--cw); height: var(--cw); background: var(--surface); border: 1.5px solid var(--paper-rule); border-radius: 4px; display: block; }
.cw-c i { position: absolute; top: 0; left: 2px; font-size: 8px; font-style: normal; font-weight: 800; color: var(--muted); line-height: 1; pointer-events: none; }
.cw-c input { width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font-weight: 800; font-size: .82rem; padding: 4px 0 0; text-transform: uppercase; color: var(--ink); caret-color: var(--accent); }
.cw-c input:focus { outline: none; }
.cw-c:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.cw-c.hl { background: var(--accent-soft); }
.cw-c.good { background: var(--ok-soft); border-color: var(--ok); }
.cw-c.bad { background: var(--bad-soft); border-color: var(--bad); }
.cw-now { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 12px 14px; font-size: .95rem; }
.clues { display: grid; gap: 6px; }
.clue { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; text-align: left; border: 0; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; line-height: 1.35; font-size: .93rem; }
.clue b { color: var(--accent); }
.clue.on { outline: 2px solid var(--accent); }
.clue.solved { opacity: .55; text-decoration: line-through; }

<div id="app"><p style="padding:24px">Cargando tu plataforma…</p></div>
<noscript><p style="padding:24px">Activa JavaScript para usar la plataforma.</p></noscript>
<script>
const V = {
  line(items) {
    return `<div class="vis line-wrap"><div class="line">${items.map((it) =>
      `<div class="line-item"><div class="line-age">${it.a}</div><div class="line-dot"></div><div class="line-t">${it.t}</div>${it.s ? `<div class="line-s">${it.s}</div>` : ''}</div>`).join('')}</div></div>`;
  },
  flow(items) {
    return `<div class="vis flow">${items.map((it, i) =>
      `<div class="flow-step"><span class="flow-n">${i + 1}</span><div><b>${it.t}</b>${it.s ? `<small>${it.s}</small>` : ''}</div></div>`).join('<div class="flow-arrow" aria-hidden="true">↓</div>')}</div>`;
  },
  tbl(head, rows) {
    return `<div class="vis tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => i === 0 ? `<td><b>${c}</b></td>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  vs(a, b) {
    const col = c => `<div class="vs-col"><div class="vs-h">${c.t}</div><ul>${c.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
    return `<div class="vis vs">${col(a)}<div class="vs-mid">vs</div>${col(b)}</div>`;
  },
  pairs(list) {
    return `<div class="vis pairs">${list.map(p => `<div class="pair"><b>${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
  },
  /* Cuadro sinóptico con llaves: raíz { ramas { hojas */
  sinop(root, br) {
    const kids = k => `<ul class="sn-kids">${k.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return `<div class="vis sn-wrap"><div class="sn"><div class="sn-root">${root}</div><div class="sn-brace" aria-hidden="true"></div><div class="sn-list">${br.map(b =>
      `<div class="sn-br"><div class="sn-bt">${b.t}</div><div class="sn-brace sm" aria-hidden="true"></div>${kids(b.kids)}</div>`).join('')}</div></div></div>`;
  },
  tree(root, kids) { return V.sinop(root, kids.map(k => ({ t: k.t, kids: k.s ? [k.s] : [] }))); },
  book(page, html) {
    return `<div class="vis bookq"><div class="bookq-h">Lo que dice el libro · pág. ${page}</div><div class="bookq-b">${html}</div></div>`;
  },
  now(html) {
    return `<div class="vis nowbox"><div class="bookq-h">Dato actual · no viene en el libro (es de 2014)</div><div class="bookq-b">${html}</div></div>`;
  }
};


/* ═══════════ CONTENIDO · Díaz-Aranda, Enrique, Lecciones de derecho penal para el nuevo sistema de justicia en México, UNAM-IIJ, 2014. Primera parte, Capítulo primero «Concepción» (págs. 3 a 5). ═══════════ */
const BOOK = {
  title: 'Lecciones de derecho penal para el nuevo sistema de justicia en México',
  author: 'Enrique Díaz-Aranda',

  /* Crucigrama */
  const CWC = (() => {
    const cells = {}; const nums = {};
    const starts = CW.words.map((w, i) => ({ i, r: w.r, c: w.col })).sort((a, b) => a.r - b.r || a.c - b.c);
    let n = 0; starts.forEach(s => { const k = s.r + '-' + s.c; if (!nums[k]) nums[k] = ++n; CW.words[s.i].n = nums[k]; });
    CW.words.forEach((w, wi) => { for (let i = 0; i < w.w.length; i++) { const r = w.d === 'A' ? w.r : w.r + i, c = w.d === 'A' ? w.col + i : w.col; const k = r + '-' + c; (cells[k] = cells[k] || { ch: w.w[i], ws: [] }).ws.push(wi); } });
    return { cells, nums };
  })();
  const cwKeys = wi => { const w = CW.words[wi]; const out = []; for (let i = 0; i < w.w.length; i++) out.push(w.d === 'A' ? w.r + '-' + (w.col + i) : (w.r + i) + '-' + w.col); return out; };
  const cwSolved = wi => cwKeys(wi).every(k => (S.cw[k] || '') === CWC.cells[k].ch);
  function vCW() {
    const hl = UI.cwWord != null ? new Set(cwKeys(UI.cwWord)) : new Set();
    let grid = '';

  /* ═════════ RENDER ═════════ */
  function render() {
    SAY = {};
    const v = UI.view; let html;
    if (v === 'lesson') html = vLesson();
    else if (v === 'tour') html = vTour();
    else {
      html = ({ home: vHome, study: vStudy, next: vNext, review: vReview, game: vGame, words: vWords, exams: vExams, exam: vExam, hoja: vHoja, videos: vVideos, avance: vAvance }[v] || vHome)();
      html += vTabs();
    }
    if (UI.sheet) html += vSheet();
    if (UI.modal) html += vModal();
    app.innerHTML = html;
    after();
  }
  function after() {
    if (UI.view === 'lesson' && S.auto && !UI.modal && UI.autoKey !== UI.mainKey) { UI.autoKey = UI.mainKey; const id = UI.mainSay; setTimeout(() => { if (SAY[id] && UI.view === 'lesson') speak(SAY[id], id); }, 350); }
    if (UI.view === 'tour' && UI.tour.play && UI.tour.spoken !== UI.tour.i) {
      const i = UI.tour.i; UI.tour.spoken = i;
      speak(TOUR[i].s, 'tour', () => { setTimeout(() => { if (UI.view === 'tour' && UI.tour.play && UI.tour.i === i && i < TOUR.length - 1) { UI.tour.i++; render(); } }, 700); });
    }
    if (UI.sheet) { const b = app.querySelector('.bsheet .btn'); if (b) b.focus({ preventScroll: true }); }
  }
  function go(v) { stop(); UI.view = v; UI.sheet = null; UI.modal = null; render(); top(); }
  function openLesson(id) { stop(); S.at = id; save(); markDay(); UI.st = id; UI.view = 'lesson'; UI.t0 = Date.now(); UI.autoKey = ''; render(); top(); }
  function move(d) {
    const id = UI.st; let { step, sub } = pos(id);
    if (d > 0) { if (sub + 1 < count(id, step)) sub++; else if (step < 4) { step++; sub = 0; toast(`Paso ${step + 1} de 5: ${STEP_NAMES[step]} ${STEP_IC[step]}`); } }
    else { if (sub > 0) sub--; else if (step > 0) { step--; sub = count(id, step) - 1; } }
    S.pos[id] = { step, sub }; save(); stop(); render(); top();
  }

  /* ═════════ EVENTOS ═════════ */
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
    const a = el.dataset.a; const G = UI.game;
    switch (a) {
      case 'go': go(el.dataset.v); break;
      case 'cont': { const nx = nextStation(); if (nx) openLesson(nx); break; }
      case 'open': openLesson(el.dataset.id); break;
      case 'exit': stop(); UI.view = 'home'; render(); top(); toast('Guardado. Aquí te espera el botón Continuar.'); break;
      case 'next': move(1); break;
      case 'prev': move(-1); break;
      case 'reveal': { const p = pos(UI.st); S.reveal[`${UI.st}:${p.step}:${p.sub}`] = true; save(); stop(); render();
        if (S.auto) { const b = app.querySelector('[data-id^="a-"]'); if (b) speak(SAY[b.dataset.id], b.dataset.id); }
        const m = app.querySelector('.model'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
      case 'lopt': { const p = pos(UI.st); const k = UI.st + ':' + p.sub; if (S.lq[k] != null) break; const q = coreQs(UI.st)[p.sub]; const i = +el.dataset.i; S.lq[k] = i; rec(q, i === q.a); stop(); render();
        const f = app.querySelector('.fb'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (S.auto) { const b = app.querySelector('.fb [data-a="say"]'); if (b) speak(SAY[b.dataset.id], b.dataset.id); } break; }
      case 'key': { const id = UI.st; const i = +el.dataset.i; const k = S.keys[id] || []; S.keys[id] = el.checked ? k.concat(i) : k.filter(x => x !== i); save(); break; }
      case 'finish': { document.querySelectorAll('.toast').forEach(t => t.remove()); const id = UI.st; S.done[id] = S.done[id] || today(); S.sp[id] = S.sp[id] || []; S.pos[id] = { step: 0, sub: 0 };
        Object.keys(S.reveal).forEach(k => { if (k.indexOf(id + ':') === 0) delete S.reveal[k]; }); Object.keys(S.lq).forEach(k => { if (k.indexOf(id + ':') === 0) delete S.lq[k]; });
        const nx = LESSONS.find(l => !S.done[l.id]); S.at = nx ? nx.id : id; save(); stop(); UI.fin = id; UI.view = 'next'; render(); top(); break; }
      case 'say': { const id = el.dataset.id; if (speakingId === id) stop(); else speak(SAY[id], id); break; }
      case 'gl': ev.preventDefault(); UI.sheet = el.dataset.k; render(); break;
      case 'sheetX': stop(); UI.sheet = null; render(); break;
      case 'rest': UI.modal = null; stop(); UI.view = 'home'; render(); top(); toast('Guardado. ¡Buen descanso!'); break;
      case 'more5': UI.modal = null; UI.t0 = Date.now() - PAUSE_MS + 5 * 60 * 1000; render(); break;
      case 'tour': stop(); UI.tour = { i: 0, play: true, spoken: -1 }; UI.view = 'tour'; render(); top(); break;
      case 'tourNext': if (UI.tour.i < TOUR.length - 1) { stop(); UI.tour.i++; UI.tour.spoken = -1; render(); } break;
      case 'tourPrev': if (UI.tour.i > 0) { stop(); UI.tour.i--; UI.tour.spoken = -1; render(); } break;
      case 'tourPlay': UI.tour.play = !UI.tour.play; if (!UI.tour.play) stop(); else UI.tour.spoken = -1; render(); break;
      case 'tourX': case 'tourEnd': stop(); S.tour = true; save(); UI.view = 'home'; render(); top(); break;
      case 'spaced': { const id = el.dataset.id; const list = shuffle(byT(id).map(q => q.id)).slice(0, 5); startQuiz(list, 'Repaso de hoy · ' + L(id).title, { spaced: id }); break; }
      case 'game': startGame(el.dataset.g); break;
      case 'quizAll': startQuiz(shuffle(BANK.map(q => q.id)).slice(0, 10), 'Mezcladas'); break;
      case 'quizSt': startQuiz(shuffle(byT(el.dataset.id).map(q => q.id)), L(el.dataset.id).title); break;
      case 'gopt': { if (G.ch != null) break; const q = QB[G.list[G.i]]; G.ch = +el.dataset.i; const ok = G.ch === q.a; if (ok) G.ok++; rec(q, ok, G.errors); stop(); render();
        const f = app.querySelector('.fb'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
      case 'gnext': G.i++; G.ch = null; stop();
        if (G.i >= G.list.length && G.spaced) { S.sp[G.spaced] = (S.sp[G.spaced] || []).concat(today()); save(); }
        render(); top(); break;
      case 'flip': G.flip = !G.flip; render(); break;
      case 'fnext': G.i = (G.i + 1) % G.list.length; G.flip = false; stop(); render(); break;
      case 'fprev': G.i = Math.max(0, G.i - 1); G.flip = false; stop(); render(); break;
      case 'tf': { const t = TF[G.list[G.i]]; G.pick = el.dataset.v === '1'; if (G.pick === t[1]) G.ok++; stop(); render(); break; }
      case 'tfnext': G.i++; G.pick = null; stop(); render(); top(); break;
      case 'ordPick': { const gi = +el.dataset.i; const n = ORDER_GAMES[gi].items.length; let arr; do { arr = shuffle([...Array(n).keys()]); } while (arr.every((x, i) => x === i)); Object.assign(G, { gi, arr, checked: false }); render(); top(); break; }
      case 'ordUp': case 'ordDn': { const i = +el.dataset.i, j = a === 'ordUp' ? i - 1 : i + 1; [G.arr[i], G.arr[j]] = [G.arr[j], G.arr[i]]; G.checked = false; render(); break; }
      case 'ordCheck': G.checked = true; render(); break;
      case 'matPick': { const gi = +el.dataset.i; const n = MATCH_GAMES[gi].pairs.length; Object.assign(G, { gi, right: shuffle([...Array(n).keys()]), done: [], sel: null, err: null }); render(); top(); break; }
      case 'matL': G.sel = +el.dataset.i; G.err = null; render(); break;
      case 'matR': { const j = +el.dataset.i; if (G.sel == null) { toast('Primero toca una palabra de la izquierda'); break; } if (j === G.sel) { G.done.push(j); G.sel = null; G.err = null; } else { G.err = j; } render(); break; }
      case 'rdMore': G.n++; stop(); render(); break;
      case 'rdShow': G.show = true; stop(); render(); break;
      case 'rdNext': G.i = (G.i + 1) % RIDDLES.length; G.n = 1; G.show = false; stop(); render(); break;
      case 'vopt': { if (G.ch != null) break; G.ch = +el.dataset.i; if (G.opts[G.i][G.ch] === G.list[G.i]) G.ok++; render(); break; }
      case 'vnext': G.i++; G.ch = null; stop(); render(); top(); break;
      case 'cwClue': { UI.cwWord = +el.dataset.i; UI.cwCheck = false; render(); const k = cwKeys(UI.cwWord).find(x => (S.cw[x] || '') !== CWC.cells[x].ch) || cwKeys(UI.cwWord)[0]; const inp = app.querySelector(`[data-cw="${k}"]`); if (inp) inp.focus(); break; }
      case 'cwCheck': UI.cwCheck = true; render(); { const s = CW.words.filter((_, i) => cwSolved(i)).length; toast(s === CW.words.length ? '¡Crucigrama completo! 🎉' : `Llevas ${s} de ${CW.words.length} palabras`); } break;
      case 'cwClear': if (ask('cw', 'Toca otra vez «Borrar todo» para confirmar')) { S.cw = {}; save(); UI.cwCheck = false; render(); } break;
      case 'exStart': UI.ex = { id: el.dataset.id, i: 0, ans: {}, done: false }; stop(); UI.view = 'exam'; render(); top(); break;
      case 'exOpt': { const e = EXAMS.find(x => x.id === UI.ex.id); UI.ex.ans[e.qs[UI.ex.i]] = +el.dataset.i; render(); break; }
      case 'exNext': UI.ex.i++; stop(); render(); top(); break;
      case 'exPrev': UI.ex.i--; stop(); render(); top(); break;
      case 'exGo': UI.ex.i = +el.dataset.i; stop(); render(); top(); break;
      case 'exEnd': { const e = EXAMS.find(x => x.id === UI.ex.id); const miss = e.qs.filter(id => UI.ex.ans[id] == null).length;
        if (miss && !ask('ex', `Te faltan ${miss} preguntas. Toca otra vez para calificar así`)) break;
        UI.ex.done = true; e.qs.forEach(id => { if (UI.ex.ans[id] != null) rec(QB[id], UI.ex.ans[id] === QB[id].a); });
        const g = Math.round(e.qs.filter(id => UI.ex.ans[id] === QB[id].a).length / e.qs.length * 100) / 10; S.exams[e.id] = Math.max(S.exams[e.id] || 0, g); save(); stop(); render(); top(); break; }
      case 'rv': UI.rv[el.dataset.k] = !UI.rv[el.dataset.k]; render(); break;
      case 'rvAll': { const ti = +el.dataset.i; const t = COMPARE[ti]; t.rows.forEach((r, ri) => r.slice(1).forEach((_, ci) => { UI.rv[ti + '-' + ri + '-' + ci] = true; })); render(); break; }
      case 'rate': S.rate = +el.dataset.v; save(); render(); speak(`Así hablo a esta velocidad, ${NAME}.`, 'test'); break;
      case 'auto': S.auto = el.checked; save(); toast(S.auto ? 'La voz explicará sola cada pantalla' : 'La voz solo habla cuando tocas Explícame'); break;
      case 'reset': if (ask('reset', 'Toca otra vez para borrar todo tu avance (no se puede deshacer)')) { const keep = { rate: S.rate, auto: S.auto, tour: S.tour }; S = Object.assign(defaults(), keep); save(); go('home'); toast('Avance borrado'); } break;
    }
  });
  document.addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset.in === 'note') { S.notes[UI.st] = el.value; save(); }
    else if (el.dataset.in === 'gq') { UI.q = el.value; SAY = {}; const box = document.getElementById('glist'); if (box) box.innerHTML = glossList(); }
    else if (el.dataset.cw) {
      const k = el.dataset.cw; const v = (el.value || '').toUpperCase().normalize('NFD').replace(/[^A-ZÑ]/g, '').slice(-1);
      el.value = v; if (v) S.cw[k] = v; else delete S.cw[k]; save();
      if (v) { const ws = UI.cwWord != null && CWC.cells[k].ws.includes(UI.cwWord) ? UI.cwWord : CWC.cells[k].ws[0]; const keys = cwKeys(ws); const nk = keys[keys.indexOf(k) + 1]; if (nk) { const n = app.querySelector(`[data-cw="${nk}"]`); if (n) { n.focus(); n.select(); } } }
    }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && UI.sheet) { UI.sheet = null; stop(); render(); } });
  document.addEventListener('focusin', ev => { const k = ev.target.dataset && ev.target.dataset.cw; if (k && (UI.cwWord == null || !CWC.cells[k].ws.includes(UI.cwWord))) { UI.cwWord = CWC.cells[k].ws[0]; const box = app.querySelector('.cw-now'); const w = CW.words[UI.cwWord]; if (box) box.innerHTML = `<b>${w.n} ${w.d === 'A' ? '→' : '↓'}</b> ${w.c}`; } });

  /* Pausa amable a los 10 minutos */
  setInterval(() => { if (UI.view === 'lesson' && !UI.modal && Date.now() - UI.t0 >= PAUSE_MS) { stop(); UI.modal = 'pause'; render(); } }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });

  render();
})();

</script>
